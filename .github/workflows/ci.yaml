name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out -count=1 ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install golangci-lint
        # Build from source with the repo's Go toolchain so the linter's build Go
        # version is never below go.mod's target. The v6 action's prebuilt binary
        # was built with go1.24 < go1.25.0 and refused to run. See issue #4.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run ./...

  vulnerability-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        # Advisory: report vulnerabilities without failing CI. The only call-path
        # finding is containerd GO-2026-5064 (transitive via helm/OCI), which has
        # no fixed release yet (Fixed in: N/A). Restore blocking once a patched
        # containerd lands. See issue #4.
        continue-on-error: true
        run: govulncheck ./...

  docker:
    needs: [build, lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f Dockerfile.server -t platform-orchestrator-server:${{ github.sha }} .

      - name: Build worker image
        run: docker build -f Dockerfile.worker -t platform-orchestrator-worker:${{ github.sha }} .
