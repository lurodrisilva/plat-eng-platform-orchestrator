apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# On-cluster deploy of the platform orchestrator (Phase G).
#
# DEPLOY FROM THE REPO ROOT, NOT FROM HERE: `kubectl apply -k .` one level up.
# The root kustomization layers this directory plus the two ConfigMaps the
# Deployment mounts. Applying THIS directory on its own renders a Deployment
# whose configMap volumes name ConfigMaps nothing creates — the pods then wedge
# in ContainerCreating. The root kustomization explains why the generator has to
# live up there rather than here.
#
# The Secret is still out of band: platform-orchestrator-secrets carries
# DOCUMENTDB_CONNECTION_STRING (from the ESO Key Vault) + ARGOCD_TOKEN (minted
# from argocd) + the GitHub App credentials. externalsecret.yaml is the
# secretless target once the ESO ClusterSecretStore is fixed. That defect blocks
# the SECRET only — it never blocked the two ConfigMaps, which is why they moved
# under kustomize on 2026-07-28, after two policy changes reached this repo and
# never reached the cluster.
namespace: platform-orchestrator

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - server.yaml
  # Publishes /api/v1 on the shared public origin (ADR-0024, slice P6). This
  # workload is hand-applied, so nothing reconciles this route: delete it and
  # the portal's API calls 404 with nothing to restore it and nothing reporting
  # it missing. Recorded, and the fast-follow is to bring this whole directory
  # under ArgoCD once the ESO ClusterSecretStore defect lets the Secret be
  # modelled here too.
  - httproute.yaml
