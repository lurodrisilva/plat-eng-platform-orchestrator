apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-orchestrator-server
  labels:
    app: platform-orchestrator
    component: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform-orchestrator
      component: server
  template:
    metadata:
      labels:
        app: platform-orchestrator
        component: server
        # Opt this pod into the Azure workload-identity webhook: it projects the
        # federated token + injects AZURE_CLIENT_ID/TENANT_ID/FEDERATED_TOKEN_FILE
        # so azidentity can push to ACR (gate 3) with no stored credential.
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: platform-orchestrator
      containers:
        - name: server
          image: acrdevbf6cc837.azurecr.io/platform-orchestrator-server:phase-g
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CONFIG_PATH
              value: /etc/config/config.yaml
            - name: POLICIES_CONFIG_PATH
              value: /etc/policies/default.yaml
            # helm's OCI registry client writes its credentials file under
            # $HOME/.config (or $XDG_CONFIG_HOME) during Login; the root FS is
            # read-only, so point HOME at the writable /tmp emptyDir.
            - name: HOME
              value: /tmp
            - name: XDG_CONFIG_HOME
              value: /tmp/.config
            - name: OTEL_SERVICE_NAME
              value: platform-orchestrator-server
            # In-cluster ArgoCD lives in devops-system and runs secure with a
            # self-signed cert; reach it over the cluster network and skip TLS
            # verification (hardening follow-up: trust the argocd CA).
            - name: ARGOCD_SERVER_URL
              value: https://argocd-server.devops-system.svc
            - name: ARGOCD_APP_NAMESPACE
              value: devops-system
            - name: ARGOCD_INSECURE
              value: "true"
            # Publish composed charts to the platform ACR (gate 3 WI push).
            - name: OCI_REGISTRY
              value: acrdevbf6cc837.azurecr.io
            # GitHub App for the Phase F scaffold-new-app dispatch (ADR-0009).
            # AppID/InstallationID and the PEM private key come from the
            # platform-orchestrator-secrets Secret (bootstrapped manually until
            # the ESO store is fixed — see externalsecret.yaml). The scaffolder
            # is built only when GITHUB_APP_ID + GITHUB_APP_PRIVATE_KEY are set.
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: platform-orchestrator-secrets
                  key: github-app-id
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: platform-orchestrator-secrets
                  key: github-app-installation-id
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-orchestrator-secrets
                  key: github-app-private-key
            # The scaffolder repo hosting the workflow, and the org the new app
            # repos land under. Literal (non-secret).
            - name: SCAFFOLDER_OWNER
              value: lurodrisilva
            - name: SCAFFOLDER_REPO
              value: net-hexagonal
            - name: NEW_REPO_OWNER
              value: lurodrisilva
          envFrom:
            # DOCUMENTDB_CONNECTION_STRING (private DocumentDB) + ARGOCD_TOKEN.
            # Bootstrapped from the ESO Key Vault + a minted ArgoCD token at
            # deploy; the secretless target is externalsecret.yaml once the ESO
            # ClusterSecretStore is fixed.
            - secretRef:
                name: platform-orchestrator-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/config
            - name: policies
              mountPath: /etc/policies
            # Writable scratch for the chart composer (chartutil.Save writes a
            # temp dir); readOnlyRootFilesystem makes / read-only.
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            # Distroless nonroot is a named user; pin the numeric UID/GID (65532)
            # so the kubelet can verify non-root under runAsNonRoot.
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: platform-orchestrator-config
        - name: policies
          configMap:
            name: platform-orchestrator-policies
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: platform-orchestrator-server
spec:
  selector:
    app: platform-orchestrator
    component: server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
