apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-orchestrator-worker
  labels:
    app: platform-orchestrator
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform-orchestrator
      component: worker
  template:
    metadata:
      labels:
        app: platform-orchestrator
        component: worker
    spec:
      serviceAccountName: platform-orchestrator
      containers:
        - name: worker
          image: myregistry.azurecr.io/platform-orchestrator-worker:latest
          env:
            - name: CONFIG_PATH
              value: /etc/config/config.yaml
            - name: OTEL_SERVICE_NAME
              value: platform-orchestrator-worker
          envFrom:
            - secretRef:
                name: platform-orchestrator-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/config
            - name: policies
              mountPath: /etc/policies
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: platform-orchestrator-config
        - name: policies
          configMap:
            name: platform-orchestrator-policies
        - name: tmp
          emptyDir: {}
