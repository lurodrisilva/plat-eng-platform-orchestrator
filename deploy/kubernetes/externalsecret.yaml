# Secretless target for the orchestrator's DocumentDB connection string (ADR-0017
# / ADR-0020 §3): External Secrets syncs it from the ESO demo Key Vault (seeded
# by aks-foundation documentdb.tf as orchestrator-documentdb-connection-string)
# into the platform-orchestrator-secrets Secret the Deployment reads.
#
# NOT applied by kustomization.yaml yet: the cluster's ClusterSecretStore
# `azure-keyvault` is InvalidProviderConfig (its workload-identity app is stale),
# so ESO cannot sync. Until that store is fixed, the Secret is bootstrapped at
# deploy directly from the Key Vault value. This manifest documents — and, once
# the store is healthy, becomes — the secretless delivery path.
#
# The ArgoCD API token (ARGOCD_TOKEN) is minted from argocd, not stored in the
# Key Vault; it is added to the same Secret operationally (or via its own store
# entry once one exists).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-orchestrator-documentdb
  namespace: platform-orchestrator
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: platform-orchestrator-secrets
    creationPolicy: Merge
  data:
    - secretKey: DOCUMENTDB_CONNECTION_STRING
      remoteRef:
        key: orchestrator-documentdb-connection-string
    # GitHub App credentials for the Phase F scaffold-new-app dispatch (ADR-0009).
    # Same secretless target as above: synced from the ESO Key Vault into the
    # platform-orchestrator-secrets Secret. Bootstrapped manually today (the
    # ClusterSecretStore is InvalidProviderConfig); these are the Secret keys the
    # Deployment's secretKeyRefs read (github-app-id / -installation-id /
    # -private-key). The private key is the App's PEM.
    - secretKey: github-app-id
      remoteRef:
        key: orchestrator-github-app-id
    - secretKey: github-app-installation-id
      remoteRef:
        key: orchestrator-github-app-installation-id
    - secretKey: github-app-private-key
      remoteRef:
        key: orchestrator-github-app-private-key
