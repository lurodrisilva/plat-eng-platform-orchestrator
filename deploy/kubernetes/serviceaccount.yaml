apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-orchestrator
  namespace: platform-orchestrator
  annotations:
    # Client ID of the gate-3 AcrPush workload identity (ADR-0021 §3,
    # aks-foundation output acr_orchestrator_push_client_id). The federated
    # credential binds this UAMI to system:serviceaccount:platform-orchestrator:
    # platform-orchestrator; the orchestrator's azidentity picks it up to push
    # composed charts to ACR with no stored credential.
    azure.workload.identity/client-id: "24cbe15f-6743-4145-8c66-08864694af03"
  labels:
    app: platform-orchestrator
