environmentRules:
  - environment: production
    allowedBranches:
      - main
      - "release/*"
    allowedRepos: []

  - environment: staging
    allowedBranches:
      - main
      - "release/*"
      - "hotfix/*"
    allowedRepos: []

  - environment: development
    allowedBranches: []  # all branches allowed
    allowedRepos: []     # all repos allowed

freezeWindows: []

# J3 tunable allowlist (on-road custom-tuning). Deny-by-default: only the
# value-key paths listed here may be overridden in the create `values` overlay;
# everything else is a platform-locked knob (it carries a guardrail). A locked
# override is rejected at the API boundary (422 LOCKED_KNOB_OVERRIDE) in
# enforce mode, or logged-and-allowed in audit mode.
#   mode: audit   -> observe would-denies, never block (audit-first default)
#   mode: enforce -> reject locked-knob overrides
#
# The allowlist is keyed per target environment: the same knob can be tunable in
# one environment and platform-locked in another. `default` is the fallback set;
# `environments.<name>` fully REPLACES it for that environment (no merge). An
# environment with no entry here (e.g. staging) uses `default`.
#   production   -> only resources.requests.* is tunable; autoscaling and limits
#                   are platform-managed (locked) so the platform owns scaling.
#   development  -> requests + limits + autoscaling + env + nodeSelector, so
#                   developers can iterate freely off-road-adjacent.
# Locked by omission everywhere: securityContext/podSecurityContext (G4),
# image (G1/G2), ownership+cost labels (G6), serviceAccount/workload-identity (G7).
#
# EVERY KEY IS PREFIXED `hex-scaffold.` AND THAT IS NOT COSMETIC (S7, defect D3).
# The deploy unit is the UMBRELLA (ADR-0008), and the application is a subchart
# aliased `hex-scaffold` in its Chart.yaml. The umbrella has no root
# `replicaCount` or `resources` key at all, so a root-scoped override is
# discarded by Helm before it reaches a template — it renders nothing and errors
# nowhere. Root-scoped entries here meant the allowlist was validating paths the
# chart never reads: validation agreed with a render that never happened.
#
# Every key below existed at the root before and exists under the alias now; the
# set of tunable knobs is unchanged, only the address is corrected. Verified
# against hex-scaffold 0.3.0's values.yaml — replicaCount:305, resources:306,
# autoscaling:314, env:39, nodeSelector:375.
#
# ROLLOUT ORDER MATTERS. The portal still emits ROOT-scoped keys until slice S6,
# so after this change its overlays read as violations. `mode: audit` is what
# makes that safe: they are logged, not blocked, and they were already being
# silently discarded by Helm — so nothing gets worse, and the audit log becomes
# the detector for D3 rather than a silent failure. Do NOT flip to enforce until
# S6 has landed, or every knob the wizard collects becomes a 422.
#
# Deliberately still locked, and worth naming so the omission reads as a
# decision: `hex-scaffold.autoscaling.targetMemoryUtilizationPercentage` sits in
# the same block as the CPU target but is not tunable. Widening the set is a
# governance change, not a re-key, so it is not made here.
#
# Do NOT add a bare `hex-scaffold` entry. Allowlist matching is prefix-based, so
# one blanket entry would make the whole subchart tunable — including
# `hex-scaffold.postgres.bindBuildingBlock`, which decides which database's
# credentials the app reads. That path is reserved and refused at the create
# boundary regardless of this file (ADR-0023), but the two must not disagree.
tunableAllowlist:
  mode: audit
  default:
    allowedKeys:
      - hex-scaffold.replicaCount
      - hex-scaffold.resources.requests.cpu
      - hex-scaffold.resources.requests.memory
      - hex-scaffold.resources.limits.cpu
      - hex-scaffold.resources.limits.memory
      - hex-scaffold.autoscaling.minReplicas
      - hex-scaffold.autoscaling.maxReplicas
      - hex-scaffold.autoscaling.targetCPUUtilizationPercentage
  environments:
    production:
      allowedKeys:
        - hex-scaffold.resources.requests.cpu
        - hex-scaffold.resources.requests.memory
    development:
      allowedKeys:
        - hex-scaffold.resources.requests.cpu
        - hex-scaffold.resources.requests.memory
        - hex-scaffold.resources.limits.cpu
        - hex-scaffold.resources.limits.memory
        - hex-scaffold.autoscaling.minReplicas
        - hex-scaffold.autoscaling.maxReplicas
        - hex-scaffold.autoscaling.targetCPUUtilizationPercentage
        - hex-scaffold.env
        - hex-scaffold.nodeSelector

# J3 resource policy (application dependencies — ADR-0023). Governs the
# `resources[]` a create/deploy request may declare: which types, and within a
# type, which sizes/versions/storage and how many instances.
#
# THIS IS NOT THE TUNABLE ALLOWLIST, and the difference is the point. An
# unallowed TUNING value mistunes a workload, so `tunableAllowlist` is
# audit-first and can log-and-allow. An unallowed RESOURCE request spends money
# and creates real Azure infrastructure, so this policy defaults to enforce and
# a refusal is a 422 RESOURCE_NOT_ALLOWED. An `audit` mode exists for a staged
# rollout, but it has to be asked for — an empty mode means enforce.
#
# THE COST IS STRUCTURAL. Each declared postgres is its OWN billed Flexible
# Server, and `size: small` maps to GP_Standard_D2s_v3 — a General Purpose SKU
# (~$140/mo observed on aks-test). The XRD enum has no burstable tier, so
# maxInstancesPerDeployment caps COUNT, not unit price. If dev-tier spend
# matters, the levers are adding a cheaper size to the XRD enum or steering
# development at the in-cluster cloudnativepg engine — neither is decided here.
#
# Resolution is by environment KEY PRESENCE, not content: an environment listed
# below uses its own rules in full, even when they allow nothing. An environment
# absent from `environments` (e.g. staging) falls back to `default`.
resourcePolicy:
  mode: enforce
  default:
    allowedTypes: [postgres]
    postgres:
      allowedSizes: [small]
      allowedVersions: ["16"]
      maxStorageMb: 32768
      maxInstancesPerDeployment: 1
  environments:
    # Developers iterate here, so a wider size/version window — still bounded,
    # because every database bills.
    #
    # maxInstancesPerDeployment is 1 and CANNOT usefully be raised. The spec
    # originally proposed 2 for development; that is unimplementable. A
    # dependency's name is derived from the application id, so a second postgres
    # derives the SAME name — the building block would render two
    # PostgresInstance objects with one metadata.name, and the app's bind
    # (bindBuildingBlock.instanceName) is a single value that can reference only
    # one. The ceiling here is a policy limit; the real limit is structural and
    # the domain refuses the second resource regardless of what this says.
    development:
      allowedTypes: [postgres]
      postgres:
        allowedSizes: [small, medium]
        allowedVersions: ["15", "16"]
        maxStorageMb: 131072
        maxInstancesPerDeployment: 1
    # DENY. Under azure-flexibleserver the app authenticates as the server
    # ADMIN — the provider generates that credential and the app binds straight
    # to it. ADR-0010 ratified the engine as dev/non-production ONLY until the
    # provider-sql least-privilege role lands, and until this entry existed that
    # gate was documentary: nothing enforced it. The empty list is the whole
    # mechanism, so do not "tidy" it away — an absent `production` key would
    # fall back to `default` and quietly permit exactly what ADR-0010 forbids.
    production:
      allowedTypes: []
