server:
  addr: ":8080"
  readTimeout: 30s
  writeTimeout: 60s

temporal:
  hostPort: "${TEMPORAL_HOST_PORT:-localhost:7233}"
  namespace: "${TEMPORAL_NAMESPACE:-default}"
  taskQueue: "deployment-workers"

auth:
  oidc:
    # Microsoft Entra ID, v1 issuer (ADR-0015). The v2.0 issuer is
    # login.microsoftonline.com/<tenant>/v2.0; the tenant here is the app
    # registration's home tenant. The GitHub Actions issuer
    # (token.actions.githubusercontent.com) is the multi-issuer CI fast-follow,
    # not v1.
    issuer: "${OIDC_ISSUER:-https://login.microsoftonline.com/8f77fb2e-7e77-477e-9a03-d078b7aad9c3/v2.0}"
    # The orchestrator's Entra app registration. Every accepted token must carry
    # this as its `aud`. api://<appId> is the Application ID URI.
    audience: "${OIDC_AUDIENCE:-api://224ccefb-cfa7-42ba-9440-1f1b03aaca72}"
    jwksCacheTTL: 24h
  allowedRepositories: []

argocd:
  serverURL: "${ARGOCD_SERVER_URL:-https://argocd.example.com}"
  insecure: false

oci:
  registry: "${OCI_REGISTRY:-myregistry.azurecr.io}"
  repositoryPrefix: ""

github:
  appID: 0
  installationID: 0
  token: "${GITHUB_TOKEN}"

documentdb:
  endpoint: "${DOCUMENTDB_ENDPOINT}"
  database: "platform-orchestrator"
  deploymentsCollection: "deployments"
  eventsCollection: "deployment-events"

otel:
  serviceName: "platform-orchestrator"
  otlpEndpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:-localhost:4317}"
  tracesSampleRate: 1.0
  insecure: true

policies:
  configPath: "policies/default.yaml"

deploymentDefaults:
  syncTimeoutSeconds: 600
  healthConvergenceTimeoutSeconds: 300
  workflowTimeoutMinutes: 20
  pollIntervalSeconds: 10
