server:
  addr: ":8080"
  readTimeout: 30s
  writeTimeout: 60s

auth:
  oidc:
    # Microsoft Entra ID, v1 issuer (ADR-0015). The orchestrator's Entra app
    # registration (api://224ccefb…) issues v1.0 access tokens
    # (accessTokenAcceptedVersion unset), so the token's `iss` claim is
    # https://sts.windows.net/<tenant>/ — NOT the v2.0
    # login.microsoftonline.com/<tenant>/v2.0 form. The default must match the
    # token exactly or the OIDC verifier rejects it (issuer mismatch). To move
    # to v2.0 later: set the app's accessTokenAcceptedVersion=2 and switch this
    # default to the …/v2.0 URL. The GitHub Actions issuer
    # (token.actions.githubusercontent.com) is the multi-issuer CI fast-follow.
    issuer: "${OIDC_ISSUER:-https://sts.windows.net/8f77fb2e-7e77-477e-9a03-d078b7aad9c3/}"
    # The orchestrator's Entra app registration. Every accepted token must carry
    # this as its `aud`. api://<appId> is the Application ID URI.
    audience: "${OIDC_AUDIENCE:-api://224ccefb-cfa7-42ba-9440-1f1b03aaca72}"
    jwksCacheTTL: 24h
  allowedRepositories: []

argocd:
  serverURL: "${ARGOCD_SERVER_URL:-https://argocd.example.com}"
  # Namespace the ArgoCD Application objects are created in (in-cluster ArgoCD).
  appNamespace: "${ARGOCD_APP_NAMESPACE:-argocd}"
  # In-cluster argocd-server is secure with a self-signed cert; a same-cluster
  # client sets this true. Hardening follow-up: trust the argocd CA instead.
  insecure: ${ARGOCD_INSECURE:-false}

oci:
  # Composed charts are published to ACR, pulled by ArgoCD via workload identity
  # (secretless — ADR-0021 §3 gate 2). The base umbrella still resolves from
  # GHCR-public anonymously.
  registry: "${OCI_REGISTRY:-acrdevbf6cc837.azurecr.io}"
  repositoryPrefix: ""

github:
  # GitHub App for the Phase F scaffold-new-app dispatch (ADR-0009). The
  # orchestrator only mints an installation token, fires workflow_dispatch, and
  # reads repo existence — the render+push runs in the workflow. AppID/PrivateKey
  # unset → scaffolder is nil and POST /api/v1/apps answers 503. The private key
  # (GITHUB_APP_PRIVATE_KEY) is a secret, injected from env, never in this file.
  appId: ${GITHUB_APP_ID:-0}
  installationId: ${GITHUB_APP_INSTALLATION_ID:-0}
  scaffolderOwner: ${SCAFFOLDER_OWNER:-lurodrisilva}
  scaffolderRepo: ${SCAFFOLDER_REPO:-net-hexagonal}
  workflowFile: ${SCAFFOLDER_WORKFLOW:-scaffold-new-app.yml}
  workflowRef: ${SCAFFOLDER_WORKFLOW_REF:-master}
  newRepoOwner: ${NEW_REPO_OWNER:-lurodrisilva}

documentdb:
  endpoint: "${DOCUMENTDB_ENDPOINT}"
  database: "platform-orchestrator"
  deploymentsCollection: "deployments"
  eventsCollection: "deployment-events"

otel:
  serviceName: "platform-orchestrator"
  otlpEndpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:-localhost:4317}"
  tracesSampleRate: 1.0
  insecure: true

policies:
  configPath: "${POLICIES_CONFIG_PATH:-policies/default.yaml}"

deploymentDefaults:
  syncTimeoutSeconds: ${SYNC_TIMEOUT_SECONDS:-600}
  # A Crossplane-provisioned Azure Flexible Server takes ~5-10 min; the executor
  # polls the ArgoCD app until it converges, so allow enough headroom.
  healthConvergenceTimeoutSeconds: ${HEALTH_CONVERGENCE_TIMEOUT_SECONDS:-300}
  workflowTimeoutMinutes: ${WORKFLOW_TIMEOUT_MINUTES:-20}
  pollIntervalSeconds: ${POLL_INTERVAL_SECONDS:-10}
